document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

if value=\"{{ p.hasHandoff }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#ff2bd6\">1 handoff<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <button sc-camel-on-click=\"{{ openModal }}\" style=\"cursor:pointer;background:transparent;color:#00f0ff;border:1px dashed #00f0ff;font:700 13px/1 'Rajdhani',sans-serif;letter-spacing:.14em;padding:13px\">+ ABRIR PROJETO<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n    <section style=\"background:#0c0e16;border:1px solid #1a2733;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);padding:18px 20px;display:flex;align-items:center;gap:18px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;flex:1;min-width:0\">\n        <span style=\"font:700 30px/1 'Rajdhani',sans-serif;letter-spacing:.06em;color:#e6edf3\">{{ P.id }}<\u002Fspan>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;font:400 11px/1 'JetBrains Mono',monospace;color:#8a99ab\">\n          <span>{{ P.path }}<\u002Fspan><span style=\"color:#00f0ff\">{{ P.remote }}<\u002Fspan><span>⎇ {{ P.branch }}<\u002Fspan><span>{{ P.lang }}<\u002Fspan><span style=\"color:#ff2bd6\">{{ P.commit }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ P.launchHere }}\" style=\"border:0;cursor:pointer;background:#00f0ff;color:#0a0a0f;font:700 13px/1 'Rajdhani',sans-serif;letter-spacing:.14em;padding:10px 16px;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)\">▶ INICIAR AGENTE<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goMemoria }}\" style=\"cursor:pointer;background:transparent;color:#00f0ff;border:1px solid #00f0ff;font:700 12px/1 'Rajdhani',sans-serif;letter-spacing:.14em;padding:9px 14px\">ABRIR WIKI · {{ P.pages }}<\u002Fbutton>\n      <button style=\"cursor:pointer;background:transparent;color:#8a99ab;border:1px solid #2a3a48;font:700 12px/1 'Rajdhani',sans-serif;letter-spacing:.14em;padding:9px 14px\">CONFIGURAR<\u002Fbutton>\n    <\u002Fsection>\n\n    <section style=\"background:#0c0e16;border:1px solid #1a2733;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);padding:14px 16px\">\n      <div style=\"display:flex;justify-content:space-between;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:#00f0ff;margin-bottom:10px\"><span>┌─ AGENTES NESTE PROJETO ─┐<\u002Fspan><span style=\"color:#6b7a8c\">controle ao vivo<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ noRunning }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:14px 0;font:400 11.5px/1.5 'JetBrains Mono',monospace;color:#6b7a8c\">Nenhum agente rodando neste projeto. Use ▶ INICIAR AGENTE acima.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ running }}\" as=\"r\" hint-placeholder-count=\"1\">\n        <div style=\"display:grid;grid-template-columns:30px 150px 96px minmax(0,1fr) 150px 60px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #121b24;font:400 11.5px/1.3 'JetBrains Mono',monospace\">\n          <span style=\"display:inline-flex;align-items:center;justify-content:center;width:26px;height:18px;font:700 10px/1 'JetBrains Mono',monospace;color:{{ r.hColor }};background:{{ r.hBg }};border:1px solid {{ r.hBorder }}\">{{ r.hCode }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"color:#e6edf3\">{{ r.agent }}<\u002Fspan><span style=\"color:#ff2bd6;font-size:10px\">{{ r.id }} · {{ r.up }}<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;color:{{ r.sColor }};font-size:10.5px\"><span style=\"width:6px;height:6px;background:{{ r.sColor }};box-shadow:0 0 6px {{ r.sColor }}\"><\u002Fspan>{{ r.status }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:3px;min-width:0\"><span style=\"color:#c4d0dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.task }}<\u002Fspan><span style=\"color:#6b7a8c;font-size:10px\">⎇ {{ r.branch }}<\u002Fspan><\u002Fspan>\n          <span style=\"color:#00f0ff\">{{ r.ctxBar }}<\u002Fspan>\n          <span style=\"color:#d7e3ee;text-align:right\">{{ r.tokens }}<\u002Fspan>\n          <div style=\"display:flex;gap:6px\">\n            <button sc-camel-on-click=\"{{ r.openConsole }}\" style=\"cursor:pointer;background:transparent;color:#00f0ff;border:1px solid #00f0ff;font:600 10px/1 'JetBrains Mono',monospace;padding:6px 8px\">CONSOLE<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ r.pause }}\" style=\"cursor:pointer;background:transparent;color:#d7e3ee;border:1px solid #2a3a48;font:600 10px/1 'JetBrains Mono',monospace;padding:6px 8px\"><sc-if value=\"{{ r.notPaused }}\" hint-placeholder-val=\"{{ true }}\">❚❚ PAUSAR<\u002Fsc-if><sc-if value=\"{{ r.isPaused }}\" hint-placeholder-val=\"{{ false }}\">▶ RETOMAR<\u002Fsc-if><\u002Fbutton>\n            <button sc-camel-on-click=\"{{ r.stop }}\" style=\"cursor:pointer;background:transparent;color:#f5ff3b;border:1px solid #4a4a1a;font:600 10px/1 'JetBrains Mono',monospace;padding:6px 8px\">■ PARAR<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 03 MEMÓRIA -->\n<sc-if value=\"{{ isMemoria }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:16px;height:calc(100vh - 168px);min-height:760px\">\n  <section style=\"background:#0c0e16;border:1px solid #1a2733;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);padding:14px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto\">\n    <div style=\"display:flex;justify-content:space-between;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:#00f0ff;margin:0 4px 12px\"><span>┌─ PROJETOS ─┐<\u002Fspan><span style=\"color:#6b7a8c\">1.284<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ tree }}\" as=\"t\" hint-placeholder-count=\"14\">\n      <div sc-camel-on-click=\"{{ t.pick }}\" style=\"display:flex;align-items:center;gap:6px;padding:6px 8px 6px {{ t.pad }};cursor:pointer;font:400 11.5px/1.2 'JetBrains Mono',monospace;color:{{ t.color }};background:{{ t.bg }};border-left:2px solid {{ t.bc }}\">\n        <span style=\"color:{{ t.iconColor }};width:10px\">{{ t.icon }}<\u002Fspan><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.label }}<\u002Fspan><span style=\"color:#4f5d6e;font-size:10px\">{{ t.count }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section style=\"background:#0c0e16;border:1px solid #1a2733;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);display:flex;flex-direction:column;min-height:0\">\n    <div style=\"display:flex;align-items:center;gap:2px;padding:10px 16px 0;border-bottom:1px solid #1a2733\">\n      <sc-for list=\"{{ memTabs }}\" as=\"tb\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ tb.go }}\" style=\"border:0;cursor:pointer;background:{{ tb.bg }};color:{{ tb.color }};font:700 13px/1 'Rajdhani',sans-serif;letter-spacing:.14em;padding:9px 16px;border-bottom:2px solid {{ tb.bc }}\">{{ tb.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"margin-left:auto;font:400 10.5px/1 'JetBrains Mono',monospace;color:#6b7a8c;padding-bottom:6px\">lea-core/memoria/<span style=\"color:#e6edf3\">decaimento-de-forca.md<\u002Fspan> · <span style=\"color:#ff2bd6\">a3f9c12<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ memPage }}\" hint-placeholder-val=\"{{ true }}\">\n      <article style=\"padding:28px 40px 40px;overflow:auto;flex:1;max-width:760px\">\n        <div style=\"display:flex;gap:8px;margin-bottom:14px\">\n          <span style=\"font:500 10px/1 'JetBrains Mono',monospace;padding:3px 6px;border:1px solid #00f0ff;color:#00f0ff\">TIER · WARM<\u002Fspan>\n          <span style=\"font:500 10px/1 'JetBrains Mono',monospace;padding:3px 6px;border:1px solid #2a3a48;color:#8a99ab\">#memoria<\u002Fspan>\n          <span style=\"font:500 10px/1 'JetBrains Mono',monospace;padding:3px 6px;border:1px solid #2a3a48;color:#8a99ab\">#arquitetura<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"margin:0 0 14px;font:700 34px/1.05 'Rajdhani',sans-serif;letter-spacing:.02em;color:#e6edf3\">Decaimento de força da memória<\u002Fh2>\n        <p style=\"margin:0 0 16px;font:400 13px/1.75 'JetBrains Mono',monospace;color:#c4d0dc;text-wrap:pretty\">Cada página da wiki carrega um valor de <span style=\"color:#00f0ff\">força<\u002Fspan> entre 0 e 1. A força cai com o tempo e sobe quando um agente lê ou cita a página. Páginas fracas saem do contexto injetado automaticamente, mas continuam no git.<\u002Fp>\n        <h3 style=\"margin:26px 0 10px;font:700 18px/1 'Rajdhani',sans-serif;letter-spacing:.1em;color:#ff2bd6\">## FÓRMULA<\u002Fh3>\n        <pre style=\"margin:0 0 16px;padding:14px 16px;background:#07080d;border:1px solid #1a2733;border-left:2px solid #00f0ff;font:400 12px/1.7 'JetBrains Mono',monospace;color:#d7e3ee;overflow:auto\">forca = base * exp(-Δt / meia_vida)\n      + 0.15 * acessos_7d\n      + 0.30 * citado_em_handoff<\u002Fpre>\n        <h3 style=\"margin:26px 0 10px;font:700 18px/1 'Rajdhani',sans-serif;letter-spacing:.1em;color:#ff2bd6\">## TIERS<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:90px 110px 1fr;border:1px solid #1a2733;font:400 12px/1 'JetBrains Mono',monospace;margin-bottom:16px\">\n          <span style=\"padding:9px 12px;background:#10141d;color:#6b7a8c;font-size:10.5px\">TIER<\u002Fspan><span style=\"padding:9px 12px;background:#10141d;color:#6b7a8c;font-size:10.5px\">MEIA-VIDA<\u002Fspan><span style=\"padding:9px 12px;background:#10141d;color:#6b7a8c;font-size:10.5px\">COMPORTAMENTO<\u002Fspan>\n          <span style=\"padding:9px 12px;border-top:1px solid #1a2733;color:#ff2bd6\">HOT<\u002Fspan><span style=\"padding:9px 12px;border-top:1px solid #1a2733\">3 dias<\u002Fspan><span style=\"padding:9px 12px;border-top:1px solid #1a2733;color:#c4d0dc\">sempre injetada no SessionStart<\u002Fspan>\n          <span style=\"padding:9px 12px;border-top:1px solid #1a2733;color:#00f0ff\">WARM<\u002Fspan><span style=\"padding:9px 12px;border-top:1px solid #1a2733\">21 dias<\u002Fspan><span style=\"padding:9px 12px;border-top:1px solid #1a2733;color:#c4d0dc\">injetada se relevante ao projeto<\u002Fspan>\n          <span style=\"padding:9px 12px;border-top:1px solid #1a2733;color:#8a99ab\">COLD<\u002Fspan><span style=\"padding:9px 12px;border-top:1px solid #1a2733\">120 dias<\u002Fspan><span style=\"padding:9px 12px;border-top:1px solid #1a2733;color:#c4d0dc\">só via busca explícita<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:26px 0 10px;font:700 18px/1 'Rajdhani',sans-serif;letter-spacing:.1em;color:#ff2bd6\">## REGRAS<\u002Fh3>\n        <ul style=\"margin:0;padding-left:18px;font:400 13px/1.85 'JetBrains Mono',monospace;color:#c4d0dc\">\n          <li>Força abaixo de 0.25 rebaixa o tier na consolidação das 23h.<\u002Fli>\n          <li>Três acessos em 48h promovem para o tier acima. Ver <span style=\"color:#ff2bd6;border-bottom:1px dotted #ff2bd6\">[[tiers-e-promocao]]<\u002Fspan>.<\u002Fli>\n          <li>Handoffs citam páginas por slug; isso conta como acesso. Ver <span style=\"color:#ff2bd6;border-bottom:1px dotted #ff2bd6\">[[formato-handoff]]<\u002Fspan>.<\u002Fli>\n          <li>Nenhuma página é apagada pelo decaimento. Exclusão só por commit manual.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ memGraph }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;position:relative;min-height:0;background:radial-gradient(circle at 50% 50%,rgba(255,43,214,.06),transparent 60%)\">\n        {{ graph }}\n        <div style=\"position:absolute;left:16px;bottom:14px;display:flex;gap:16px;font:400 10.5px/1 'JetBrains Mono',monospace;color:#6b7a8c\">\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;background:#ff2bd6\"><\u002Fspan>página atual<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border:1px solid #00f0ff\"><\u002Fspan>link direto<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border:1px solid #3a4a5a\"><\u002Fspan>2º grau<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:absolute;right:16px;bottom:14px;font:400 10.5px/1 'JetBrains Mono',monospace;color:#6b7a8c\">17 nós · 24 arestas · profundidade 2<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <aside style=\"display:flex;flex-direction:column;gap:16px;overflow:auto\">\n    <section style=\"background:#0c0e16;border:1px solid #1a2733;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:#00f0ff;margin-bottom:2px\">┌─ METADADOS ─┐<\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font:400 11px/1 'JetBrains Mono',monospace\"><span style=\"color:#6b7a8c\">tier<\u002Fspan><span style=\"color:#00f0ff\">WARM<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font:400 11px/1 'JetBrains Mono',monospace\"><span style=\"color:#6b7a8c\">último acesso<\u002Fspan><span>há 2h · claude-code<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font:400 11px/1 'JetBrains Mono',monospace\"><span style=\"color:#6b7a8c\">acessos 7d<\u002Fspan><span>14<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font:400 11px/1 'JetBrains Mono',monospace\"><span style=\"color:#6b7a8c\">id<\u002Fspan><span style=\"color:#ff2bd6\">0x7a3f19<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #1a2733\">\n        <div style=\"display:flex;justify-content:space-between;font:400 11px/1 'JetBrains Mono',monospace\"><span style=\"color:#6b7a8c\">força<\u002Fspan><span style=\"color:#e6edf3\">0.71<\u002Fspan><\u002Fdiv>\n        <span style=\"font:400 14px/1 'JetBrains Mono',monospace;color:#00f0ff;text-shadow:0 0 8px rgba(0,240,255,.4)\">▮▮▮▮▮▮▮<span style=\"color:#2a3a48\">▮▮▮<\u002Fspan><\u002Fspan>\n        <span style=\"font:400 18px/1 'JetBrains Mono',monospace;color:#00f0ff;letter-spacing:1px\">█▇▇▆▅▅▄▃▃▂▂▂▁▁▁<\u002Fspan>\n        <div style=\"display:flex;justify-content:space-between;font:400 9.5px/1 'JetBrains Mono',monospace;color:#4f5d6e\"><span>agora<\u002Fspan><span>7d · 0.52<\u002Fspan><span>30d · 0.19<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background:#0c0e16;border:1px solid #1a2733;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);padding:14px 16px;display:flex;flex-direction:column;gap:2px\">\n      <div style=\"display:flex;justify-content:space-between;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:#00f0ff;margin-bottom:8px\"><span>┌─ VERSÕES GIT ─┐<\u002Fspan><span style=\"color:#6b7a8c\">7<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ versions }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid #121b24;font:400 11px/1.35 'JetBrains Mono',monospace\">\n          <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#ff2bd6\">{{ v.sha }}<\u002Fspan><span style=\"color:#4f5d6e\">{{ v.when }}<\u002Fspan><\u002Fdiv>\n          <span style=\"color:#c4d0dc\">{{ v.msg }}<\u002Fspan>\n          <span style=\"color:{{ v.hColor }};font-size:10px\">{{ v.agent }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n    <section style=\"background:#0c0e16;border:1px solid #1a2733;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font:400 11px/1.4 'JetBrains Mono',monospace\">\n      <div style=\"font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:#00f0ff;margin-bottom:4px\">┌─ LINKS ─┐<\u002Fdiv>\n      <span style=\"color:#6b7a8c;font-size:10px\">← ENTRADA (4)<\u002Fspan>\n      <span style=\"color:#ff2bd6\">tiers-e-promocao<\u002Fspan><span style=\"color:#ff2bd6\">formato-handoff<\u002Fspan><span style=\"color:#ff2bd6\">decisoes/adr-07-decaimento<\u002Fspan><span style=\"color:#ff2bd6\">consolidacao-noturna<\u002Fspan>\n      <span style=\"color:#6b7a8c;font-size:10px;margin-top:6px\">→ SAÍDA (3)<\u002Fspan>\n      <span style=\"color:#00f0ff\">tiers-e-promocao<\u002Fspan><span style=\"color:#00f0ff\">formato-handoff<\u002Fspan><span style=\"color:#00f0ff\">hooks/session-start<\u002Fspan>\n    <\u002Fsection>\n  <\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 03 SESSÕES & HANDOFFS -->\n<sc-if value=\"{{ isSessoes }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:16px;align-items:start\">\n  <section style=\"background:#0c0e16;border:1px solid #1a2733;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);padding:14px 18px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:#00f0ff;margin-bottom:14px\">\n      <span>┌─ LINHA DO TEMPO ─┐<\u002Fspan>\n      <div style=\"display:flex;gap:6px\">\n        <sc-for list=\"{{ sessFilters }}\" as=\"sf\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ sf.go }}\" style=\"cursor:pointer;font:500 10px/1 'JetBrains Mono',monospace;padding:5px 8px;background:{{ sf.bg }};color:{{ sf.color }};border:1px solid {{ sf.bc }}\">{{ sf.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:600 12px/1 'Rajdhani',sans-serif;letter-spacing:.2em;color:#6b7a8c;padding:6px 0 12px\">HOJE · 27 OUT 2026<\u002Fdiv>\n    <sc-for list=\"{{ sessions }}\" as=\"s\" hint-placeholder-count=\"7\">\n      <div style=\"display:grid;grid-template-columns:48px 20px minmax(0,1fr);gap:10px\">\n        <span style=\"font:400 11px/1 'JetBrains Mono',monospace;color:#6b7a8c;padding-top:14px;text-align:right\">{{ s.t }}<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;align-items:center\">\n          <span style=\"width:2px;height:12px;background:#1a2733\"><\u002Fspan>\n          <span style=\"width:9px;height:9px;transform:rotate(45deg);background:{{ s.hColorSolid }};box-shadow:0 0 8px {{ s.hColorSolid }}\"><\u002Fspan>\n          <span style=\"width:2px;flex:1;background:#1a2733\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin:6px 0;padding:11px 14px;border:1px solid #1a2733;background:#0a0c13;display:flex;flex-direction:column;gap:7px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)\">\n          <div style=\"display:flex;align-items:center;gap:10px;font:400 11px/1 'JetBrains Mono',monospace\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:26px;height:18px;font:700 10px/1 'JetBrains Mono',monospace;color:{{ s.hColor }};background:{{ s.hBg }};border:1px solid {{ s.hBorder }}\">{{ s.hCode }}<\u002Fspan>\n            <span style=\"color:#e6edf3\">{{ s.agent }}<\u002Fspan>\n            <span style=\"color:#ff2bd6\">{{ s.id }}<\u002Fspan>\n            <span style=\"color:#6b7a8c\">{{ s.project }} · {{ s.dur }}<\u002Fspan>\n            <span styl
